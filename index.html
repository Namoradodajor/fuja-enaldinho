<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Fuga da Mansão Elo - 28/16</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
  .box { max-width: 600px; margin: auto; background: #1e1e2e; padding: 25px; border-radius: 15px; border: 3px solid #39ff14; box-shadow: 0 0 20px #39ff1455; }
  .hud { display: flex; justify-content: space-around; background: #000; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 1.1em; margin-bottom: 20px; }
  button { display: block; width: 100%; margin: 10px 0; padding: 12px; font-size: 1em; font-weight: bold; cursor: pointer; background: #ff0055; color: white; border: none; border-radius: 8px; transition: 0.2s; }
  button:hover { background: #ff3377; transform: scale(1.02); }
</style>
</head>
<body>
<div class="box">
  <h1>🎬 FUGA DA MANSÃO ELO</h1>
  <div class="hud">
    <span id="en">⚡ Energia: 28/28</span>
    <span id="al">👀 Alerta: 0/16</span>
  </div>
  <p id="texto">"Fala galera, tudo bem com vocês?!" O Enaldinho começou a caçada! Você está atrás das caixas perto da piscina de slime.</p>
  <div id="opcoes">
    <button onclick="jogar(1, -3, 0)">1. Engatinhar pelas caixas (-3 Energia | +0 Alerta)</button>
    <button onclick="jogar(1, -1, 3)">2. Correr pela borda do slime (-1 Energia | +3 Alerta)</button>
  </div>
</div>

<script>
  let energia = 28, alerta = 0, ato = 1;

  function jogar(fase, dEn, dAl) {
    energia += dEn;
    alerta += dAl;
    document.getElementById('en').innerText = `⚡ Energia: ${energia}/28`;
    document.getElementById('al').innerText = `👀 Alerta: ${alerta}/16`;

    const txt = document.getElementById('texto');
    const ops = document.getElementById('opcoes');

    if (energia <= 0 || alerta >= 16) {
      txt.innerText = "🚨 GAME OVER! O Enaldinho te achou com a câmera ligada: 'ACHAMOS ELE GALERA!'";
      ops.innerHTML = `<button onclick="location.reload()">Tentar Novamente</button>`;
      return;
    }

    if (fase === 1) {
      txt.innerText = "📍 ATO 2: Você chegou ao corredor das 100 Caixas Misteriosas! Vini está gravando o Enaldinho abrir a Caixa 50.";
      ops.innerHTML = `
        <button onclick="jogar(2, -5, 4)">1. Empurrar a parede de caixas (-5 Energia | +4 Alerta)</button>
        <button onclick="jogar(2, -1, 1)">2. Se esconder dentro da Caixa 99 (-1 Energia | +1 Alerta)</button>
      `;
    } else if (fase === 2) {
      txt.innerText = "📍 ATO 3: O portão da Mansão Elo está logo ali, mas tem uma piscina gigante de bolinhas no caminho!";
      ops.innerHTML = `
        <button onclick="jogar(3, -6, 2)">1. Mergulhar por baixo das bolinhas (-6 Energia | +2 Alerta)</button>
        <button onclick="jogar(3, -8, 5)">2. Correr pelo muro (-8 Energia | +5 Alerta)</button>
      `;
    } else {
      txt.innerText = `🎉 VITÓRIA! Você escapou da Mansão Elo com ${energia}/28 de Energia e ${alerta}/16 de Alerta!`;
      ops.innerHTML = `<button onclick="location.reload()">Jogar de Novo</button>`;
    }
  }
</script>
</body>
</html>
